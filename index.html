<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gary's Island</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #0b0410;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100dvh; /* dynamic viewport height fixes Safari toolbar issue */
        padding-bottom: env(safe-area-inset-bottom, 10px); /* Add safe area for iOS */
        box-sizing: border-box;
        touch-action: none; /* Prevent scroll on touch */
      }
      #font-preload {
        font-family: 'Press Start 2P';
        position: absolute;
        visibility: hidden;
      }
      #app {
        position: relative;
        width: 800px;
        height: 600px;
        max-width: 100%;
        /* Leave some space at bottom for trackpad on mobile */
        max-height: calc(100dvh - 140px); 
        overflow: hidden;
      }
      #trackpad {
        display: none;
        width: 90%;
        height: 80px;
        margin-top: 20px;
        border: 2px solid #00FFFF;
        border-radius: 8px;
        background: rgba(0, 255, 255, 0.1);
        color: #00FFFF;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        box-sizing: border-box;
        font-family: 'Press Start 2P', monospace;
        font-size: 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      @media (max-width: 768px) {
        #trackpad {
          display: flex;
        }
      }
      /* (CRT effekte) */
      .crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 255, 0.08), rgba(0, 255, 255, 0.04), rgba(255, 0, 255, 0.08));
        z-index: 2;
        background-size: 100% 4px, 6px 100%;
        pointer-events: none;
      }
      .crt::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.5) 100%);
        z-index: 3;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="font-preload">.</div>
    <div id="app" class="crt"></div>
    <div id="trackpad">
      <span>◀</span>
      <span>SWIPE TO MOVE</span>
      <span>▶</span>
    </div>
    
    <script>
      window.gameMovementDirection = 0; // -1 for left, 1 for right, 0 for none

      document.addEventListener('DOMContentLoaded', () => {
        const trackpad = document.getElementById('trackpad');
        let touchStartX = null;
        
        trackpad.addEventListener('touchstart', (e) => {
          touchStartX = e.touches[0].clientX;
        }, { passive: false });

        trackpad.addEventListener('touchmove', (e) => {
          e.preventDefault(); // Prevent scrolling
          if (touchStartX === null) return;
          
          const currentX = e.touches[0].clientX;
          const deltaX = currentX - touchStartX;
          
          if (deltaX < -15) {
            window.gameMovementDirection = -1;
          } else if (deltaX > 15) {
            window.gameMovementDirection = 1;
          } else {
            window.gameMovementDirection = 0;
          }
        }, { passive: false });

        const stopTouch = () => {
          touchStartX = null;
          window.gameMovementDirection = 0;
        };

        trackpad.addEventListener('touchend', stopTouch);
        trackpad.addEventListener('touchcancel', stopTouch);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

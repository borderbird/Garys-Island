<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gary's Island</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #0b0410;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #font-preload {
        font-family: 'Press Start 2P';
        position: absolute;
        visibility: hidden;
      }
      #app {
        position: relative;
        width: 800px;
        height: 600px;
        overflow: hidden;
      }
      .crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 255, 0.08), rgba(0, 255, 255, 0.04), rgba(255, 0, 255, 0.08));
        z-index: 2;
        background-size: 100% 4px, 6px 100%;
        pointer-events: none;
      }
      .crt::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.5) 100%);
        z-index: 3;
        pointer-events: none;
      }
      @keyframes flicker {
        0% { opacity: 0.95; }
        5% { opacity: 0.85; }
        10% { opacity: 0.95; }
        15% { opacity: 1; }
        100% { opacity: 1; }
      }
      .crt {
        /* animation: flicker 0.15s infinite; removed as requested */
      }
    </style>
  </head>
  <body>
    <div id="font-preload">.</div>
    <div id="app" class="crt"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
